[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panepost"
version = "0.0.2"
description = "A tmux-native control desk for listing AI coding agents, routing messages to supported clients, and restoring sessions."
readme = "README.md"
license = "MIT"
authors = [{ name = "jefftko" }]
requires-python = ">=3.10"
keywords = ["tmux", "claude-code", "codex", "ai-agents", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/jefftko/panepost"

[project.scripts]
ag = "panepost.cli:main"
panepost = "panepost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
